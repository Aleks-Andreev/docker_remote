[workspace.package]
version = "0.1.0"
rust-version = "1.99"
edition = "2024"
license = "MIT"
authors = ["Aleks Andreev"]
categories = ["command-line-utilities", "development-tools", "virtualization"]
keywords = ["docker", "remote", "synchronization", "ssh"]
description = "DORE: DOcker Remote Executor"

[workspace]
resolver = "3"
members = [
    "rust/dore",
    "rust/dore_configs_reader",
    "rust/dore_ssh"
]

[workspace.dependencies]
yaml-rust2 = "0.13"
tokio = { version = "1.0", features = ["full"] }
log = "0.4"
simple_logger = "5.2"
anyhow = "1.0"
rayon = "1.12"
clap = { version =  "4.6", features = ["color", "usage", "derive"] }
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0"
walkdir = "2.5"
regex = "1.13"
sha2 = "0.11"
