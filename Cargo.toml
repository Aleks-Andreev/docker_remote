[workspace.package]
version = "0.1.0"
rust-version = "1.99"
edition = "2024"
license = "MIT"
authors = ["Aleks Andreev"]
categories = ["command-line-utilities", "development-tools", "virtualization"]
keywords = ["docker", "remote", "synchronization", "ssh"]
description = "DORE: DOcker Remote Executor"

[workspace]
resolver = "3"
members = [
    "rust/dore",
    "rust/dore_lib",
]

[workspace.dependencies]
yaml-rust2 = "0.13"
tokio = { version = "1.0", features = ["full"] }
log = "0.4"
log4rs = {
    version = "1.4",
    default-features = true,
    features = [
        "rolling_file_appender",
        "compound_policy",
        "fixed_window_roller",
        "gzip",
        "threshold_filter",
        "simple_writer",
        "pattern_encoder",
        "size_trigger",
        "console_appender",
    ]
}
flate2 = "1.0"
anyhow = "1.0"
clap = { version =  "4.6", features = ["color", "usage", "derive"] }
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3.0"
regex = "1.13"
crossterm = { version = "0.29", features = ["event-stream"] }
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
async-trait = "0.1"
futures = "0.3"
shellexpand = { version = "3", features = ["full"] }
dirs = "7.0"
